[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordle-solver"
version = "0.1.0"
description = "Wordle solver and analysis tools"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
]

[tool.setuptools]
py-modules = [
    "BayesianProbability",
    "DatabaseBuilder",
    "NaiveGuesser",
    "RandomBullshit",
    "SurpriseCalculator",
    "WordleNarrower",
    "WordleOptimizer",
]
